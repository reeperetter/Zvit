name: Build iOS IPA (Manual)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS platform files & Info.plist Permissions
        run: |
          flutter create --platforms=ios .
          python3 -c '
          import plistlib
          plist_path = "ios/Runner/Info.plist"
          with open(plist_path, "rb") as f:
              pl = plistlib.load(f)
          pl["NSCameraUsageDescription"] = "Aplikacja wymaga dostępu do kamery w celu dokumentacji usterek."
          pl["NSMicrophoneUsageDescription"] = "Aplikacja wymaga dostępu do mikrofonu do dyktowania opisu usterek."
          pl["NSSpeechRecognitionUsageDescription"] = "Rozpoznawanie mowy służy do zamiany głosu na opis usterki."
          pl["NSPhotoLibraryUsageDescription"] = "Dostęp do galerii jest wymagany do wczytania rzutów mieszkań."
          with open(plist_path, "wb") as f:
              plistlib.dump(pl, f)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Zvit-iOS-Unsigned.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Zvit-iOS-IPA
          path: Zvit-iOS-Unsigned.ipa
