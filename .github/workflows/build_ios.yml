name: Build iOS IPA (Manual)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS platform files & Info.plist Permissions
        run: |
          flutter create --platforms=ios --project-name qreport --org com.qreport .
          python3 -c '
          import plistlib
          plist_path = "ios/Runner/Info.plist"
          with open(plist_path, "rb") as f:
              pl = plistlib.load(f)
          pl["CFBundleDisplayName"] = "QReport"
          pl["CFBundleName"] = "QReport"
          pl["NSCameraUsageDescription"] = "Aplikacja wymaga dostępu do kamery w celu dokumentacji usterek."
          pl["NSMicrophoneUsageDescription"] = "Aplikacja wymaga dostępu do mikrofonu do dyktowania opisu usterek."
          pl["NSSpeechRecognitionUsageDescription"] = "Rozpoznawanie mowy służy do zamiany głosu na opis usterki."
          pl["NSPhotoLibraryUsageDescription"] = "Dostęp do galerii jest wymagany do wczytania rzutów mieszkań."
          with open(plist_path, "wb") as f:
              plistlib.dump(pl, f)
          '

      - name: Install dependencies & Generate iOS Icons
        run: |
          cat << 'EOF' > flutter_launcher_icons_ios.yaml
          flutter_launcher_icons:
            android: false
            ios: true
            image_path: "assets/icon/app_icon.png"
            remove_alpha_ios: true
          EOF
          flutter pub get
          dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r QReport-iOS-Unsigned.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: QReport-iOS-IPA
          path: QReport-iOS-Unsigned.ipa
