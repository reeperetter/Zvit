name: Build Android APK (Manual)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform files & Configure QReport
        run: |
          flutter create --platforms=android --project-name qreport --org com.qreport .
          python3 -c '
          import os, re

          manifest = "android/app/src/main/AndroidManifest.xml"
          with open(manifest, "r") as f:
              content = f.read()
          perms = """
          <uses-permission android:name="android.permission.CAMERA"/>
          <uses-permission android:name="android.permission.RECORD_AUDIO"/>
          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
          <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
          """
          if "android.permission.CAMERA" not in content:
              content = content.replace("<application", perms + "\n    <application")
          content = re.sub(r"android:label=\"[^\"]*\"", "android:label=\"QReport\"", content)
          with open(manifest, "w") as f:
              f.write(content)

          gradle_kts = "android/app/build.gradle.kts"
          gradle_gro = "android/app/build.gradle"
          if os.path.exists(gradle_kts):
              with open(gradle_kts, "r") as f:
                  g = f.read()
              if "checkReleaseBuilds" not in g:
                  g += "\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}\n"
                  with open(gradle_kts, "w") as f:
                      f.write(g)
          elif os.path.exists(gradle_gro):
              with open(gradle_gro, "r") as f:
                  g = f.read()
              if "checkReleaseBuilds" not in g:
                  g += "\nandroid {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n"
                  with open(gradle_gro, "w") as f:
                      f.write(g)
          '

      - name: Install dependencies & Generate Android Icons
        run: |
          cat << 'EOF' > flutter_launcher_icons_android.yaml
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/app_icon.png"
            adaptive_icon_background: "#184673"
            adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
          EOF
          flutter pub get
          dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml

      - name: Build Android APK
        run: |
          if [ "${{ inputs.build_mode }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: QReport-Android-APK-${{ inputs.build_mode }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore
