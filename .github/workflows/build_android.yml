name: Build Android APK (Manual)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform files & Permissions
        run: |
          flutter create --platforms=android .
          python3 -c '
          manifest = "android/app/src/main/AndroidManifest.xml"
          with open(manifest, "r") as f:
              content = f.read()
          perms = """
          <uses-permission android:name="android.permission.CAMERA"/>
          <uses-permission android:name="android.permission.RECORD_AUDIO"/>
          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
          <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
          """
          content = content.replace("<application", perms + "\n    <application")
          with open(manifest, "w") as f:
              f.write(content)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          if [ "${{ inputs.build_mode }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Zvit-Android-APK-${{ inputs.build_mode }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore
