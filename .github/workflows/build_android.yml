name: Build Android APK (Manual)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform files & Configure Permissions + Lint
        run: |
          flutter create --platforms=android .
          python3 -c '
          import os
          manifest = "android/app/src/main/AndroidManifest.xml"
          with open(manifest, "r") as f:
              content = f.read()
          perms = """
          <uses-permission android:name="android.permission.CAMERA"/>
          <uses-permission android:name="android.permission.RECORD_AUDIO"/>
          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
          <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
          """
          if "<uses-permission android:name=\"android.permission.CAMERA\"/>" not in content:
              content = content.replace("<application", perms + "\n    <application")
          with open(manifest, "w") as f:
              f.write(content)

          gradle_kts = "android/app/build.gradle.kts"
          gradle_gro = "android/app/build.gradle"
          if os.path.exists(gradle_kts):
              with open(gradle_kts, "r") as f:
                  g = f.read()
              if "checkReleaseBuilds" not in g:
                  lint_block = """
          android {
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          """
                  g = g + "\n" + lint_block
                  with open(gradle_kts, "w") as f:
                      f.write(g)
          elif os.path.exists(gradle_gro):
              with open(gradle_gro, "r") as f:
                  g = f.read()
              if "checkReleaseBuilds" not in g:
                  lint_block = """
          android {
              lintOptions {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          """
                  g = g + "\n" + lint_block
                  with open(gradle_gro, "w") as f:
                      f.write(g)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          if [ "${{ inputs.build_mode }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Zvit-Android-APK-${{ inputs.build_mode }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore
